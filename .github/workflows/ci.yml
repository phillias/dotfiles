name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

      - name: YAML lint
        run: pip install yamllint && yamllint -d relaxed .

      - name: JSON lint
        run: |
          find . -name '*.json' \
            -not -path './.git/*' \
            -not -path './.no-mistakes/*' \
            | while read f; do
                python3 -c "import json; json.load(open('$f'))" 2>&1 && echo "OK: $f" || echo "SKIP: $f (likely JSONC)"
              done

      - name: Python syntax
        run: |
          find . -name '*.py' \
            -not -path './.git/*' \
            -not -path '*/last30days/*' \
            -not -path '*/ce-*/*' \
            | xargs python3 -m py_compile

      - name: Chezmoi verify
        run: |
          curl -sfL https://github.com/twpayne/chezmoi/releases/latest/download/chezmoi_$(uname -s)_$(uname -m).tar.gz | tar xz -C /usr/local/bin
          chezmoi verify

  tool-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and validate opencode
        run: |
          npm install -g opencode-ai
          opencode debug config

      - name: Install bun + omp
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install -g @oh-my-pi/pi-coding-agent

      - name: Validate omp config
        run: |
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          omp config list --json

      - name: Install and verify hermes-gateway
        run: |
          npm install -g hermes-gateway
          hermes onboard --help || true
