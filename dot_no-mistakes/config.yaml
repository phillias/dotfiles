# no-mistakes global configuration

# Agent to use for code generation. This may also be an ordered fallback list,
# for example: agent: [codex, claude]
# Options: auto, claude, codex, rovodev, opencode, pi, copilot, cursor,
# acp:<target>
# "auto" detects the first available native agent or ACP alias on your system
# "cursor" is an ACP alias for acp:cursor using cursor-agent acp via acpx
# "acp:cursor" also uses that Cursor default command
# Use acp:<target> to run an optional user-installed acpx target, for example
# acp:gemini
agent: pi

# opencode review step is broken for thinking-mode models: the adapter sends a
# tool_choice that providers reject ("Thinking mode does not support this
# tool_choice", upstream issue kunchenguid/no-mistakes#633). pi is a separate
# harness that avoids that adapter path entirely.
#
# Gate reserves the model's full output budget for structured review output, so
# a 1M-context model is required for large diffs.
# (2026-09-21; rung names refreshed 2026-09-28) Gate rides pi's
# `fallback/gate` chain in ~/.pi/fallback-chains.json: opencode-go-gw
# deepseek head → CfAiGw/dynamic/pr-gate → vercel/router/pr-gate
# (exact ladder: provider-catalog references/ROUTING_TOPOLOGY.md flow-2).
# The CF dynamic route stays mid-chain while Vercel remains the outage
# fallthrough.
# (2026-10-04) longcat-2.5-preview-free removed from the gate chain entirely:
# as gate/test chain head it emitted unparseable findings JSON twice in one
# day (bare ${...} template outside strings; JSON object followed by
# trailing prose) and stalled silently to the 60m budget kill. deepseek-v4-flash
# (same rung the review chain leads with) produced clean structured output
# all day with zero stalls. Gate and review now share the deepseek head.
# (2026-10-04, later) glm-5.2:free positioned at the HEAD of both gate and
# review chains (captain directive: every JSON-bearing stage — reviewer, test,
# document, lint, rebase-repair, PR-drafting, CI-fix — should try the free
# glm lane first; deepseek-v4-flash stays rung-2 as the proven-JSON safety
# net, virtual routers demoted behind it). Longcat is light-work/scout-class
# only — never a JSON-bearing pipeline role. Caveats: pi agent fallback fires
# on invocation failure only, NOT on silent stalls or JSON parse failures —
# a stalling head still burns the budget; if glm stalls on test, consider
# test_agent_working_timeout or per-run --model pins. OpenRouter :free lanes
# historically rate-limit aggressively (2026-09-01 trio removed after run
# deaths; 2026-09-15 inkling 403 funnel + TM logging) — 429/403 invocations
# DO fall through to deepseek rung-2, which is the designed safety net.
# (2026-09-13) The pi args no longer carry the `-nc` (no repo context files)
# harness flag. That flag only stops AGENTS.md /
# CLAUDE.md discovery and loading — plugins and skills are separate surfaces it
# never suppressed (verified against pi 0.84.2 --help) — so it was a poor
# proxy for "no repo review-guide posture". Suppression now rides solely on the
# trusted per-repo `disable_project_settings` option: the dotfiles repo sets it
# true (suppressed posture; its apply target is the entire home directory), all
# other repos leave it unset/false so repo AGENTS.md review guides flow.
# (2026-09-14) The global pi model pin moved from agent_args_override into
# agent_config: agent_args_override native argv always wins over the same
# knob, which silently nullified review_agents.reviewer.model (review steps
# kept riding fallback/gate head dynamic/pr-gate). Profile-level model lets
# review_agents.reviewer.model win for review steps only; all other steps
# keep the profile pin.
# (2026-10-10, captain) Both pi chains re-headed away from deepseek
# (~/.pi/fallback-chains.json reordered the same day): gate =
# CfAiGw/dynamic/pr-gate first (its designed GOAT GLM-5.2 head is dark
# while subscriptions are dry, so nemotron answers at the rung; the GLM
# head lights itself at renewal — nemotron is captain-approved for the
# non-review stages) → deepseek safety net → vercel fallthrough; review =
# CfAiGw/dynamic/pr-reviewer first (NIM z-ai/glm-5.3 head, captain-ordered
# fit 2026-09-28) → deepseek safety net → vercel → PAYG glm-5.2 terminal.
# Exact ladders: provider-catalog references/ROUTING_TOPOLOGY.md flow-2.
agent_config:
  pi:
    # (2026-09-21; rung names refreshed 2026-09-28) Ride pi's fallback/gate
    # chain instead of directly pinning CfAiGw/dynamic/pr-gate; its
    # vercel/router/pr-gate rung is the CF-gateway-outage fallthrough.
    model: fallback/gate

# Review rides the separate `fallback/review` chain so the second-set-of-eyes
# exercises the pr-reviewer ladder (openrouter-direct/z-ai/glm-5.2:free head →
# opencode-go-gw deepseek → CF dynamic/pr-reviewer →
# vercel/router/pr-reviewer → openrouter-direct/z-ai/glm-5.2 PAYG terminal
# rung, kept per captain 2026-10-04; exact ladder: provider-catalog references
# ROUTING_TOPOLOGY.md flow-2) rather than the cheaper gate ladder.
# Budget-ranked, JSON discipline first, stronger model pool than gate.
review_agents:
  reviewer:
    agent: pi
    # Separate chain from gate; review needs the stronger pr-reviewer ladder
    # but must not bypass the Vercel fallback rung.
    model: fallback/review

# Optional path to the user-installed acpx binary for acp:<target> agents and
# ACP aliases
# acpx_path: acpx

# Optional ACP target command overrides for acp:<target> agents and ACP aliases
# acp_registry_overrides:
#   local-gemini: node /opt/mock-acp-agent.mjs
#   cursor: cursor-agent acp

# Maximum time the CI monitor babysits an open PR with no base-branch movement
# before giving up. The monitor watches CI and auto-rebases when the base branch
# advances; each base advance re-arms this timer, so an actively-updated green
# PR
# keeps its monitor. Set to "unlimited", "none", "off", "never", or any
# non-positive duration to monitor until the PR is merged, closed, or the run is
# aborted with: no-mistakes axi abort --run <id>
ci_timeout: "168h"

# (2026-10-04) Tightened 60m -> 12m per observed step durations after the
# longcat era: legitimate review turns 36s-434s, legitimate test turns
# 2.5m-7.7m (worst observed step with two fix rounds ~19.8m; the earlier
# 2026-09-01 nemotron NIM >30m requirement died with that chain). Stalls at
# 60m burned ~51 silent minutes each before the budget kill; 12m caps that
# damage with headroom over every clean run observed.
# (2026-10-04, later) test_agent_timeout raised 12m -> 25m: two consecutive
# glm-headed test drives were cut at 12m while ACTIVELY working (274-313
# observed outputs, last activity 6-22s before the cut) — provider slowness
# under the free lane, not stalls.
# (2026-10-05) review_agent_timeout raised 12m -> 25m: the 12m cap
# killed legitimate wide-scope reviews mid-output (rebase-heavy reviews on
# fast-moving upstream main) with zero findings.
# (2026-10-08) review_agent_timeout raised 25m -> 60m (captain): three
# consecutive fleet-tunnels review runs were killed mid-work by the
# wall-clock budget while ACTIVELY producing output — 25m, then 40m, then
# 45m; the 45m kill landed while the reviewer was writing its final
# findings JSON (8934 outputs, last 2s before the cut, risk judged low).
# This is glm free-lane deliberation slowness, not a stall; 60m restores
# the old ceiling for reviews only, test keeps 25m.
# (2026-10-10) review_agent_timeout 60m -> 20m (captain): those 40-45m
# "actively working" runs were the re-emit spiral the 2026-10-10 pi
# convergence contract (agent_args_override below) now targets at the
# prompt level; with the contract landed and the review chain re-headed
# with GLM-5.3 (pr-reviewer route first, deepseek rung-1 safety net),
# 20m holds ~3x headroom over the worst legitimate review observed
# (~434s, 2026-10-04 data) while capping spirals before they burn an
# hour. If a review cannot converge in 20m under the contract, it is
# spiralling and should be cut.
# (2026-10-10, later) review_agent_timeout 20m -> 30m (captain): the first
# GLM-5.3-headed review (NIM free lane) burned the full 20m with only 23
# sparse outputs and 1m3s quiet before the kill — NIM free suffers a long
# initial queue delay under the viral-wave load, so 20m cuts queued reviews
# before they start. 30m keeps the spiral cap meaningfully below the old 60m
# while admitting queue latency; test keeps 25m.
# (2026-10-10, latest) ADD review_agent_working_timeout: 60m (captain
# approved, "good find"): run 2 with 30m flat burned 1,800,715ms with 28
# outputs, last 1m14s before the kill — invocation-table evidence shows
# steady serving (~1 output/min, output tokens nearly doubled 4,667 ->
# 9,512 with the extra 10m), i.e. producing-but-slow, not a queue wait
# and not a silent stall. Upstream semantics: review_agent_timeout is
# the stall budget; a still-working review may continue ONLY up to
# review_agent_working_timeout (absolute cap, 10-min quiet stop still
# applies). Unset = hard stop mid-output, which cancelled two healthy-
# but-slow GLM-5.3 reviews. 30m stall / 60m working keeps spirals capped
# while letting continuously-producing reviews finish.
# Edit THIS template, not ~/.no-mistakes/config.yaml — the */30
# chezmoi-axi sync cron overwrites the live file from here.
review_agent_timeout: "30m"
review_agent_working_timeout: "60m"
test_agent_timeout: "25m"

# AXI status marks a running/fixing step as quiet when no step log or native
# agent lifecycle activity has appeared for this long. This is observability
# only; it never cancels work.
step_quiet_warning: "10m"

# Maximum time a CLI client waits for an existing daemon socket to accept a
# connection before failing instead of hanging.
daemon_connect_timeout: "3s"

# Reuse one durable fixer session per run across review-fix turns. Review turns
# always run session-free so a rereview never resumes the session that
# prescribed
# its fixes. Supported for claude and codex; other agents run cold. Set false to
# force every agent invocation cold.
session_reuse: true

# Log level for daemon output
# Options: debug, info, warn, error
log_level: info

# Override native agent binary paths (optional)
# (2026-09-02: removed the active opencode override — it hardcoded a
# /home/ubuntu path from primary55522 onto every other host in the fleet.
# Auto-detection resolves the correct per-host binary.)
# agent_path_override:
#   claude: /usr/local/bin/claude
#   codex: /opt/codex

# Extra native agent CLI flags (optional, global only)
# Codex service_tier controls speed/priority; model_reasoning_effort controls
# reasoning depth.
# agent_args_override:
#   codex:
#     - -m
#     - gpt-5.4
#     - -c
#     - service_tier="priority"
#     - -c
#     - model_reasoning_effort="low"
#
# (2026-09-24) Pi minimal profile: strip harness overhead that no pipeline step
# uses. Skills, extensions, prompt templates, and themes are never needed by
# gate/review/test/lint/document/CI steps. Tools stay enabled because fixer,
# test, document, lint, and CI-repair steps need file access. Project context
# suppression is handled separately per-repo via disable_project_settings.
# (2026-09-26) This caused major issues with pipeline thrashing and
# hallucinations.
# agent_args_override:
#   pi:
#     - "--no-skills"
#     - "--no-extensions"
#     - "--no-prompt-templates"
#     - "--no-themes"
#
# (2026-10-10) Pi convergence contract, active below: pipeline agents were
# finishing their step correctly, then re-deriving and re-emitting their own
# completed output to "double-check" it — a second JSON emission fails
# no-mistakes parsing ("multiple JSON code fences found in output"), voiding
# the attempt and forcing a full rerun (observed: 51m docs-only review vs the
# 36s-434s legitimate range; run 01M4HW9FEN00ME61FDVKW2SHYT, plus two more
# 25m+ runs 2026-10-09). Swapping model families (glm -> deepseek) did not
# change it — pi has no temperature or reasoning-effort knob on any surface
# we control, so the lever is prompt-level: the step prompts carry no
# emit-once/termination contract. --append-system-prompt adds the missing
# stop rule to every pi-invoked step (gate/review/test/lint/document/CI/fixer)
# while keeping pi's core context and skills intact — the 2026-09-24 minimal
# profile above (which stripped context instead) caused thrashing and
# hallucinations. Appending text does not pin a model, so it does not touch
# the agent_config/review_agents model separation noted 2026-09-14 above.
agent_args_override:
  pi:
    - "--append-system-prompt"
    - "Convergence contract: complete your assigned step, then produce your final output exactly once and stop. Never re-derive, re-verify, re-emit, or append commentary to output you already produced; a completed result is final and re-emitting it is a failure, not diligence. Emit JSON as raw text without markdown code fences, with no prose after it. When you are about to double-check your own finished output, stop instead: the pipeline validates it and will ask again if it is wrong."

# Maximum follow-up auto-fix attempts per step (0 = disabled after the initial
# pass)
# Document fixes are attempted during the initial document pass.
auto_fix:
  rebase: 3
  lint: 3
  test: 3
  review: 0
  document: 3
  ci: 3

# How many times the CI step may re-run a single check the provider reported as
# cancelled before that check reaches an approval gate instead of the fix agent.
# Defaults to 0: a cancelled conclusion does not identify who cancelled, so a
# rerun can restart a job a maintainer or a concurrency rule stopped on purpose.
# Raise this only for repositories whose cancellations are known to be
# provider-side. Each rerun is another workflow run billed to the repository
# being contributed to. A repository that sets ci.rerun_transient on its own
# default branch overrides this value.
ci:
  rerun_transient: 0

# Auto-fix commit subject template. Available variables: {{.Step}} and
# {{.Summary}}.
# Repo config may override this value.
# commit:
#   fix_message: "no-mistakes({{.Step}}): {{.Summary}}"

# User-intent extraction. When you push a branch, no-mistakes can read recent
# transcripts from your local agent (Claude Code, Codex, OpenCode, Rovo Dev, Pi,
# Copilot CLI), pick the session that produced the change, summarize the user
# intent, and feed it to review, test, document, lint, and PR agents so they
# understand what you were trying to do - not just the diff.
# (2026-09-02: disabled fleet-wide after the keys-profile-migration incident —
# intent extraction read local agent transcripts and fed unrelated cleanup
# intent into a no-mistakes run operating on the dotfiles repo, whose apply
# target is the entire home directory. Re-enable only with per-repo scoping.)
intent:
  enabled: false
  threshold: 0.2
  slack_days: 3
  # disabled_readers: [codex]

# Test-step evidence artifacts (screenshots, recordings, logs the test step
# gathers to demonstrate the change works). By default they are kept in a
# temporary directory and referenced by local path. Opt in to store_in_repo to
# commit them into the repo under a readable, branch-named directory so they are
# pushed and render directly on the PR. Enabled 2026-09-13 (no longer commented
# out — schema verified against no-mistakes 1.72.0 via `no-mistakes doctor`).
test:
  evidence:
    store_in_repo: true
    dir: .no-mistakes/evidence
