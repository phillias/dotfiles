# ~/.kimi-code/config.toml
# Runtime settings for Kimi Code.
# Login will populate managed Kimi provider and model entries.
# The CF AI Gateway token is injected by chezmoi run_once script.

# CF AI Gateway provider for BYOK model routing
[providers.cf-aig]
type = "openai_legacy"
base_url = "https://gateway.ai.cloudflare.com/v1/a7fa198dd5b359a187c671064fe6b36e/opencode/compat"
api_key = "CF_AI_GW_TOKEN_PLACEHOLDER"

# Claude via CF Gateway
[models.claude-via-cf]
provider = "cf-aig"
model = "dynamic/claude"
max_context_size = 200000
capabilities = ["thinking"]

# Codex (GPT) via CF Gateway
[models.codex-via-cf]
provider = "cf-aig"
model = "dynamic/codex"
max_context_size = 200000
capabilities = ["thinking"]

# Grok via CF Gateway
[models.grok-via-cf]
provider = "cf-aig"
model = "dynamic/grok"
max_context_size = 200000
capabilities = ["thinking"]

# Muse via CF Gateway
[models.muse-via-cf]
provider = "cf-aig"
model = "dynamic/muse"
max_context_size = 200000

# Kimi in-family via CF Gateway
[models.kimi-via-cf]
provider = "cf-aig"
model = "dynamic/kimi"
max_context_size = 256000
capabilities = ["thinking"]

# TUI daily driver via CF Gateway
[models.tui-via-cf]
provider = "cf-aig"
model = "dynamic/TUI"
max_context_size = 200000
