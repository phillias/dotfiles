# Portable agent CLI credential snapshots seeded from BWS project phillias.
# Format: tool<TAB>secret_key<TAB>$HOME-relative path<TAB>mode
# Blank lines and lines whose first non-space character is # are ignored.
# Secret values are base64 of the credential file. Never commit those values.
# grok is intentionally absent: portability is unverified (dotfiles#589).
commandcode	AGENT_COMMANDCODE_AUTH_JSON	.commandcode/auth.json	0600
codex	AGENT_CODEX_AUTH_JSON	.codex/auth.json	0600
claude	AGENT_CLAUDE_CREDENTIALS_JSON	.claude/.credentials.json	0600
opencode	AGENT_OPENCODE_AUTH_JSON	.local/share/opencode/auth.json	0600
