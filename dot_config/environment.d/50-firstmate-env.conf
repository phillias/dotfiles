# systemd --user environment seed (read by the user manager at startup).
# Gives every user service - including the no-mistakes gate daemon - a zsh
# SHELL so no-mistakes' "apply login shell environment" resolution runs
# `zsh -l` and sources ~/.zshenv (CF_AI_GATEWAY_TOKEN, mise shims PATH),
# plus the static env vars agents need in any shell. (set 2026-09-01)
SHELL=/usr/bin/zsh
BROWSER=carb
CLOUDFLARE_ACCOUNT_ID="a7fa198dd5b359a187c671064fe6b36e"
PLAYWRIGHT_BROWSERS_PATH={{ .chezmoi.homeDir }}/.cache/ms-playwright
PNPM_HOME="{{ .chezmoi.homeDir }}/.local/share/pnpm"
LD_LIBRARY_PATH="{{ .chezmoi.homeDir }}/.local/lib:$LD_LIBRARY_PATH"
