# Fleet-trimmed config 2026-10-29: disable ML (largest RAM consumer),
# cap dbengine retention. Tracked in phillias/dotfiles (dot_config/netdata/).
[ml]
	enabled = no

[db]
	mode = dbengine
	dbengine tier 0 retention size = 512MB
	dbengine tier 1 retention size = 512MB
	dbengine tier 2 retention size = 512MB
	dbengine page cache size = 32MB
