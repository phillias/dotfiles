[Service]
# Token source (2026-10-16): harvest from the bws-first login environment
# (zsh -l -> .zshenv -> ~/.agents/keys/load-keys.sh), NOT the retired age
# fallbacks — those went stale after the vault rotation and the daemon
# silently 401'd every pipeline step for ~2 days (runs 01M4YE376AC5NZMAW618S4SZYV,
# 01M4ZY27BDF3676RG7565Y3RBR). The harvest script fail-fasts on a definitive
# 401 from either gateway so systemd shows the unit failed loudly instead of
# letting a token-dead pipeline spin for days.
ExecStartPre=%h/.local/bin/nm-daemon-env-harvest.sh
EnvironmentFile=-/run/user/1000/no-mistakes-daemon.env
