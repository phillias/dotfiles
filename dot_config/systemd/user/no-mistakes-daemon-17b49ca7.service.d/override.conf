[Service]
# Token source (Wave A2, 2026-10-27): harvest from the bws-first login
# environment (zsh -l -> .zshenv -> ~/.agents/keys/load-keys.sh) at every
# daemon start so vault rotations propagate. This generation's drop-in
# previously age-decrypted the retired .cf-ai-gw.age and
# .vercel-gateway-key.age copies; the shared loader uses its <=24h vault
# cache when bws is unavailable and never age-decrypts those copies. Same
# harvest contract as the 8d343b26 generation;
# %t keeps the env-file path uid-agnostic.
ExecStartPre=%h/.local/bin/nm-daemon-env-harvest.sh
EnvironmentFile=-%t/no-mistakes-daemon.env
