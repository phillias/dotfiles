# mise global tool manifest — declarative pins for npm-global CLI fleet.
# System-owned runtimes (node, python, ruby, java) deliberately NOT declared:
# the OS owns them; mise only manages the packages below via its npm backend.
# Reconcile with: chezmoi apply (triggers run_onchange_mise-sync) or `mise install`.
# Drift check: mise install --dry-run-code (exit 1 = declared-but-missing).

[settings]
not_found_system_fallback = true  # shims fall back to system PATH binaries when unresolvable
# aube (mise's embedded npm installer) runs a trust check that aborts
# non-interactively for packages whose short name isn't in mise's tool registry
# (codemem, composio) — "user aborted `mise add <name>`". Shell out to the real
# npm CLI instead, which skips that check. See mise docs/dev-tools/backends/npm.md.
npm.shell_out = true

[tools]
"npm:chrome-devtools-axi" = "0.1.29"
"npm:composio" = "1.0.0"
"npm:gh-axi" = "0.1.30"
"npm:lavish-axi" = "0.1.50"
"npm:pnpm" = "11.20.0"
"npm:@masculinecache/quota-axi" = "0.1.30"
"npm:tasks-axi" = "0.2.5"
"npm:wrangler" = "4.125.0"
"npm:@earendil-works/pi-coding-agent" = "0.85.1"  # pi coding agent — provides the `pi` command (replaces dropped @oh-my-pi inert pin). 0.85.1 pick 2026-09-20: 0.86.0 (released 2026-09-19) regresses long agent sessions with "Stream ended without finish_reason" — two gate runs died mid-session on it while 0.84.2 completed a full pipeline the same night; static x-opencode-session header in the opencode-go-gw provider remains load-bearing (pi does not send it natively for custom providers, verified 0.86.0). Re-bump past 0.85.1 only after verifying a full no-mistakes run.
# no-mistakes gate pipeline (kunchenguid/no-mistakes) — NOT the unrelated npm
# "no-mistakes" package (jonathanong, TS analysis). Installed via mise's go
# backend (system go toolchain); repave 2026-09-02 after the wipe deleted
# ~/.no-mistakes/bin. Main package lives in the module's cmd/no-mistakes
# subdir (module root has no non-test Go files). 1.60.2: the global config
# schema (review_agent_timeout etc.) post-dates 1.53.0 — strict unmarshal
# rejects it there; 1.60.2 is the release line the fleet config targets.
# 1.72.0 (2026-09-13 bump): catches the v1.60.2→v1.72.0 maintenance line —
# pipeline features shipped between the two release lines; the fleet global
# config (dot_no-mistakes/config.yaml) parses on 1.72.0 per `no-mistakes
# doctor` (not the pi thinking-mode tool_choice issue).
"go:github.com/kunchenguid/no-mistakes/cmd/no-mistakes" = "1.72.0"
# mise's registry-resolved gh tool (cli/cli release binary; verified via
# `mise x gh@2.100.0 -- gh --version`). Replaces the ~/bin/gh hand-download
# branch in scripts/setup.sh; the identity router (dot_local/bin/executable_gh)
# wraps this mise binary. Pinned 2026-09-14 to stop the infinite config
# re-parse hang when installs/gh existed with no [tools] entry (every gh shim
# invocation spun re-parsing the config instead of resolving).
gh = "2.100.0"
# semgrep — deterministic static-analysis security gate for the dotfiles repo
# (scripts/validate.sh). Matches SonarQube-class findings (OSS rule packs,
# taint mode) without standing up a Sonar server. Pinned equality-only: semgrep
# doesn't guarantee replays, so CI never resolves a floating range. 1.177.0 is
# current but ships only manylinux_2_34 wheels; this host's fleet baseline is
# glibc 2.31 (Ubuntu), so the newest release still publishing manylinux2014
# (glibc-2.17-compatible) wheels is 1.157.0 — pinned to that for portability.
"pipx:semgrep" = "1.157.0"
# gitleaks — deterministic secret-leak gate for the dotfiles repo
# (scripts/validate.sh), default ruleset; equality-only pin.
"github:gitleaks/gitleaks" = "8.30.1"
# @oh-my-pi/pi-coding-agent dropped: the manifest pin (17.3.1) ships NO `pi` shim.
# The working `pi` is @earendil-works/pi-coding-agent@0.86.0, pinned in this manifest.
# Broadened manifest — npm-global CLIs consolidated under mise (npm.shell_out path).
"npm:@ast-grep/cli" = "0.43.0"
"npm:@bitwarden/cli" = "2026.5.0"
"npm:@smithery/cli" = "4.11.1"
"npm:codeburn" = "0.9.19"
"npm:gws-axi" = "0.17.0"
"npm:typescript" = "6.0.3"
"npm:typescript-language-server" = "5.3.0"
# Agent harnesses — CLI fleet for Firstmate dispatch
"npm:@anthropic-ai/claude-code" = "2.1.263"
"npm:@openai/codex" = "0.153.4"
"npm:@xai-official/grok" = "1.0.13"
# bun via mise's core backend (replaces the npm-packaged bun.exe global; dedupe removes it).
bun = "1.3.14"
# opencode CLI — core backend (standalone binary)
opencode = "1.18.29"
# opencode plugin SDK — TypeScript API for building plugins
"npm:@opencode-ai/plugin" = "1.18.29"
# DSP dynamic context pruning — token optimization plugin for OpenCode
"npm:@tarquinen/opencode-dcp" = "3.1.15"
# opencode plugins — notification, sanitization, guards, telemetry
"npm:opencode-ntfy.sh" = "1.1.0"
"npm:opencode-log-sanitizer" = "1.3.0"
"npm:envsitter-guard" = "0.0.4"
"npm:opencode-telemetry" = "0.1.19"
# opencode-models-discovery — auto-populate model lists from provider endpoints
"npm:opencode-models-discovery" = "1.5.5"
# herdr — agent terminal workspace manager (static binary via GitHub release)
"github:herdrdev/herdr" = "0.9.0"
 # treehouse — firstmate worker worktree pool (GitHub-release binary; replaces the
 # standalone installer copy, the manifest now owns it)
 "github:kunchenguid/treehouse" = "2.3.0"
 # cloudflared — Cloudflare tunnel CLI (mise registry; replaces setup.sh branch)
 cloudflared = "2025.9.0"
 # chezmoi — dotfile manager (mise registry; replaces setup.sh branch)
 chezmoi = "2.70.4"
 go = "1.25"
