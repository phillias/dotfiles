# mise global tool manifest — declarative pins for npm-global CLI fleet.
# System-owned runtimes (node, python, ruby, java) deliberately NOT declared:
# the OS owns them; mise only manages the packages below via its npm backend.
# Reconcile with: chezmoi apply (triggers run_onchange_mise-sync) or `mise install`.
# Drift check: mise install --dry-run-code (exit 1 = declared-but-missing).

[settings]
not_found_system_fallback = true  # shims fall back to system PATH binaries when unresolvable
# aube (mise's embedded npm installer) runs a trust check that aborts
# non-interactively for packages whose short name isn't in mise's tool registry
# (codemem, composio) — "user aborted `mise add <name>`". Shell out to the real
# npm CLI instead, which skips that check. See mise docs/dev-tools/backends/npm.md.
npm.shell_out = true

[tools]
# age — chezmoi's encryption backend: dot_agents/private_keys/**/*.age sources
# (active + private_retired/) decrypt through the age shim. 1.2.1 was already
# installed but UNPINNED,
# so every decrypting chezmoi apply died with 'No version is set for shim: age'
# (chezmoi doctor: failed age-command exit status 1) until this pin landed
# (2026-10-04). Verify with: age --version via the shim.
age = "1.2.1"
# bws — Bitwarden Secrets Manager CLI (machine-account tokens that never lock,
# the fluid-access vault lane for opencode/firstmate agents; bws-axi wrapper
# and scripts/bws-migrate-keys.sh consume it). mise registry entry
# bitwarden-secrets-manager (aqua:bitwarden/sdk); the binary ships at the
# version-dir root (installs/bitwarden-secrets-manager/<v>/bws, no bin/
# subdir). 2.1.0 was installed 2026-10-12 but UNPINNED, so the PATH shim died
# with 'No version is set for shim: bws' (bws-axi doctor: auth failed via
# shim; direct-path binary works) until this pin landed. The keys loader also
# exports BWS_BIN at the latest alias below, per the mise skill path strategy.
# Verify with: bws --version via the shim.
bitwarden-secrets-manager = "2.1.0"
"npm:chrome-devtools-axi" = "0.1.29"
"npm:composio" = "1.0.0"
"npm:gh-axi" = "0.1.30"
"npm:lavish-axi" = "0.1.86"
"npm:pnpm" = "11.20.0"
"npm:quota-axi" = "0.1.60"  # upstream from frozen @masculinecache fork (0.1.30, Aug 31 republish to retire the vendored overlay); firstmate floor is 0.1.51
"npm:tasks-axi" = "0.2.6"  # firstmate floor 0.2.6 (update --archive-body, mv [<id>...])
"npm:wrangler" = "4.125.0"
"npm:@earendil-works/pi-coding-agent" = "0.84.2"  # pi coding agent — provides the `pi` command (replaces dropped @oh-my-pi inert pin). Kept at 0.84.2 2026-09-20: both 0.85.1 and 0.86.0 die on long gate agent sessions with "Stream ended without finish_reason" (three pipeline deaths) while raw streams through the same lane complete cleanly with finish_reason stop — a pi 0.85+ stream-parsing regression; 0.84.2 completed two full pipelines the same night. The static x-opencode-session header on opencode-go-gw is load-bearing on every version (pi does not send it natively for custom providers). Re-bump only after a full no-mistakes run passes on the candidate.
# no-mistakes gate pipeline (kunchenguid/no-mistakes) — NOT the unrelated npm
# "no-mistakes" package (jonathanong, TS analysis). Installed via mise's go
# backend (system go toolchain); repave 2026-09-02 after the wipe deleted
# ~/.no-mistakes/bin. Main package lives in the module's cmd/no-mistakes
# subdir (module root has no non-test Go files). 1.60.2: the global config
# schema (review_agent_timeout etc.) post-dates 1.53.0 — strict unmarshal
# rejects it there; 1.60.2 is the release line the fleet config targets.
# 1.72.0 (2026-09-13 bump): catches the v1.60.2→v1.72.0 maintenance line —
# pipeline features shipped between the two release lines; the fleet global
# config (dot_no-mistakes/config.yaml) parses on 1.72.0 per `no-mistakes
