# dotfiles has no CI workflow on this repo.
# Declare no_ci so the gate treats an empty forge checks response as all-passed
# instead of waiting for checks that never register.
no_ci: true

# --- CI replay-workflow hardening pattern (documentation only; dotfiles stays
# no_ci: true and its existing CI surface is structural/tool-config-only, with
# NO PR-code-checkout steps today). For the next repo that adopts a PR-review
# job, the hardened pattern is:
#   1. PR-triggered jobs (pull_request) must pin the action SHAs, not branch
#      tags (actions/checkout@<sha>), and reuse a repo-own runner set.
#   2. Never check out PR head with full write tokens: checkout uses
#      persist-credentials: false, and any push/review replay runs from the
#      *base* branch of a trusted workflow instead of the PR checkout.
#   3. "Replay" of review/test jobs on the same PR head is re-triggered only
#      by re-running the workflow (gh run rerun / rebase land), never by a
#      comment-triggered dispatch that merges untrusted fork checks into a
#      privileged context.
#   4. Gate commands (scripts/validate.sh, semgrep, gitleaks) are invoked from
#      a single repo-owned script so tool config lives in the repo, not in
#      inline CI YAML.
# Keep this block next to the no_ci declaration so the two are read together.

# (2026-09-02 stale-path incident) This repo's apply target is the ENTIRE home
# directory of every fleet host that runs chezmoi against it. No pipeline step
# may auto-fix anything here: every finding escalates to a human decision.
# This is belt-and-suspenders behind the firstmate-layer rule that dotfiles
# ships [direct-PR] and never enters a no-mistakes run at all.
auto_fix:
  rebase: 0
  lint: 0
  test: 0
  review: 0
  document: 0
  ci: 0

# --- Review-guide posture register (suppressed-posture entry). Enabled
# 2026-09-13 (captain decision, per-repo posture now authoritative instead of
# the removed --no-context-files harness flag in dot_no-mistakes/config.yaml):
# agent-orchestration/apply-target-is-the-home surfaces run suppressed — the
# gate validation agent must not adopt home AGENTS.md authority, because this
# repo's apply target is the ENTIRE home directory on every fleet host and
# stale guidance would be applied everywhere (2026-09-02 stale-path incident
# is the counterexample class). disable_project_settings (repo-level) is
# respected only on the trusted default branch. Cross-reference: no-mistakes
# repo docs, "disable_project_settings".
#
# Fleet convention: unset/false (default) -> repo AGENTS.md review guides flow
# to the gate agent; true -> suppressed. Any future flip must be authored here
# BEFORE enabling.
disable_project_settings: true
